name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: Build docs and run notebooks
        run: make -C docs html
      - name: Verify notebook downloads
        run: python docs/scripts/verify_notebook_downloads.py --source-dir docs/source --html-dir docs/build/html
