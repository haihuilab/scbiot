[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "scbiot"
description = "Single-cell multi-omics integration and spatiotemporal dynamics via optimal transport"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Haihui Zhang", email = "hanfei19@gmail.com" }]
dynamic = ["version"]
keywords = [
  "single-cell",
  "omics",
  "optimal transport",
  "spatiotemporal",
  "bioinformatics",
  "rna",
  "atac",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.8",
  "numpy>=2,<2.2",
  "pandas>=1.5,<3",
  "pot>=0.9.6.post1",
  "pyranges>=0.1.4",
  "scanpy>=1.11.4",
  "scipy>=1.12,<1.17",
  "seaborn>=0.13",
  "scikit-learn>=1.2",
  "scikit-misc>=0.5.2",
  "statsmodels>=0.14",
  "torch>=2.5,<2.11",
  "wrapt>=1.10.10,<2",
]
[project.optional-dependencies]
docs = [
  "sphinx>=9.1,<10",
  "sphinx-rtd-theme>=3.1",
  "myst-parser>=5.0",
  "myst-nb>=1.3",
]
dev = [
  "pytest>=8.0",
]
analysis = [
  "scib==1.1.7",
  "scib-metrics==0.5.1",
  "category_encoders==2.8.1",
  "wandb==0.21.1",
]
notebooks = [
  "ipykernel>=7.1.0",
]
cpu = [
  "faiss-cpu>=1.12,<2",
]
gpu = [
  "faiss-gpu-cu12==1.14.1.post1; platform_system == 'Linux'",
  "torch==2.10.0; platform_system == 'Linux'",
]
full = [
  "scbiot[analysis,gpu,notebooks]",
]

[project.urls]
Homepage = "https://github.com/haihuilab/scbiot"
Documentation = "https://scbiot.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/haihuilab/scbiot/issues"
Changelog = "https://github.com/haihuilab/scbiot/blob/main/CHANGES.md"

[tool.hatch.version]
path = "src/scbiot/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/scbiot",
  "README.md",
  "README.rst",
  "CHANGES.md",
  "LICENSE",
  "docs",
  "tutorials",
]
exclude = [
  "/examples/",
  "/tutorials/benchmarks/**/datasets/",
  "/tutorials/benchmarks/**/venv*/",
]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/scbiot"]
include = ["src/scbiot/py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
